services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement-uis
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped